version: v0.4
project:
  name: Critical recovery, query lower bounds and binary-native width
  description: Critical detecting-set counts, physical test-list and black-box query lower bounds,
    and critical-set and cycle recovery through a fixed source-reading program. Primal/incidence
    treewidth bounds concern specification and complete binary-expanded native CNF graphs; a
    conditional cover-layout theorem bounds treewidth, net-cutwidth and block width. Strong and
    deletion backdoors into Horn, renamable-Horn and two-CNF have cardinality at least the bus
    count for both native and specification formulas.
  authors:
  - Idris Ali Shaik
  license: Apache-2.0
  responsible_maintainers:
  - Idris Ali Shaik
classification:
  arxiv:
  - 'cs.CC'
  msc2020:
  - '68Q25'
  - '68Q60'
sources:
- title: 'Polynomial Fault Detection Without Bounded Width: Exact Reachable Sets in Priority Controllers'
  authors:
  - Idris Ali Shaik
  id: doi:10.5281/zenodo.23400057
  type: preprint
  location: https://zenodo.org/records/23400057
  relationship: formalizes
  note: Version 1.0; critical families, query obstructions, backdoors and Proposition 6.10. The
    additional width graphs use the complete binary-expanded native CNF.
  license: unknown
  author_endorsement: participated
related_formalizations: []
status:
  scope: The selected surface preserves the existing counts, query bounds, backdoors and specification-graph
    width results. It adds physical critical/cycle recovery through one fixed 57-instruction program
    at each word width, including source loading, canonical indicator output, halt and displayed
    time/live/resident bounds. It also adds the complete binary-expanded native CNF primal and
    incidence treewidth lower bounds. Recovery retains the stated source-row and root promises;
    it does not recognize arbitrary malformed inputs. The separately supplied source-construction
    companions discharge the general forest construction obligation.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
