alignment:
  namespace: Controller
  statements:
  - source: Example 6.1 (cycle decoder; native execution refinement where stated)
    lean: Controller.Cost.CriticalSets.cycle_complete
    module: Controller.Cost.CriticalSets
    status: proved
    note: The actual costed cycle-decoder recovery run returns all channels, halts with a detecting
      physical descriptor, and includes source validation, array/program formation and explicit
      linear tick/storage bounds under the matching representation premises. These are fetched-execution
      bounds after constructing the instance-dependent forest program; the reference constructor's
      precomputed selection is not charged by those ticks.
  - source: Example 6.1 (cycle decoder; native execution refinement where stated)
    lean: Controller.Cost.CriticalSets.cycle_unique
    module: Controller.Cost.CriticalSets
    status: proved
    note: Any admissible set whose canonical realization detects the cycle decoder is the full
      channel universe. This is the uniqueness component of Example 6.1.
  - source: Proposition 6.2 (critical sets; native recovery refinement where stated)
    lean: Controller.Boundaries.physical_test_list_lower_bound
    module: Controller.Boundaries.CriticalSets
    status: proved
    note: Any fixed physical test list that detects every critical observation has at least as
      many entries as critical eligible sets. It is a syntax-independent universal-test-list lower
      bound, not a sequential-time lower bound for a decoder-reading algorithm.
  - source: Proposition 6.2 (critical sets; native recovery refinement where stated)
    lean: Controller.Boundaries.criticalSets_card_one
    module: Controller.Boundaries.CriticalSets
    status: proved
    note: For one bus, the critical-set family has exactly 2^(n-1)-1 members, with the target
      an inhabited channel.
  - source: Proposition 6.2 (critical sets; native recovery refinement where stated)
    lean: Controller.Boundaries.criticalSets_card_many
    module: Controller.Boundaries.CriticalSets
    status: proved
    note: For at least two buses, the critical-set family has exactly 2^n-2 members.
  - source: Proposition 6.2 (critical sets; native recovery refinement where stated)
    lean: Controller.Cost.CriticalSets.critical_complete
    module: Controller.Cost.CriticalSets
    status: proved
    note: For every supplied critical set, the actual matched forest recovery program returns
      that set and a detecting physical descriptor with the validation, formation and linear native
      resource bounds in RecoveryRun. These are fetched-execution bounds after constructing the
      instance-dependent forest program; the reference constructor's precomputed selection is
      not charged by those ticks.
  - source: Corollary 6.3 (adaptive query bound)
    lean: Controller.Boundaries.deterministic_one_bus
    module: Controller.Boundaries.OracleQueries
    status: proved
    note: Every finite adaptive query tree correct on the one-bus critical family and bottom oracle
      has worst-case query budget at least 2^(n-1)-1.
  - source: Corollary 6.3 (adaptive query bound)
    lean: Controller.Boundaries.deterministic_many_buses
    module: Controller.Boundaries.OracleQueries
    status: proved
    note: For at least two buses, every finite adaptive query tree correct on the critical family
      and bottom oracle has budget at least 2^n-2.
  - source: Corollary 6.3 (adaptive query bound)
    lean: Controller.Boundaries.randomized_mixture_lower_bound
    module: Controller.Boundaries.OracleQueries
    status: proved
    note: For a finite nonnegative normalized mixture of query trees, each with budget at most
      r and success at least 2/3 on the bottom and every critical oracle, critical-set cardinality
      is at most 3*r. This is the displayed finite randomized-query model.
  - source: Proposition 6.10 (n-ary specification-graph component)
    lean: Controller.Graph.NativeWidth.primal_treewidth_lower
    module: Controller.Graph.NativeMinor
    status: proved
    note: The primal graph of the n-ary specification clauses has treewidth at least min(channels,buses).
      The selected statement does not transfer this bound to the expanded bounded-gate CNF.
  - source: Proposition 6.10 (n-ary specification-graph component)
    lean: Controller.Graph.NativeWidth.incidence_treewidth_lower
    module: Controller.Graph.NativeMinor
    status: proved
    note: The incidence graph of the n-ary specification clauses has treewidth at least min(channels,buses).
      The selected statement does not transfer this bound to the expanded bounded-gate CNF.
  - source: Proposition 6.12 (syntactic backdoors)
    lean: Controller.Boundaries.Backdoors.native_backdoor_lower_bound
    module: Controller.Boundaries.Backdoors
    status: proved
    note: Every strong or deletion backdoor of the bounded global native formula into the displayed
      Horn, renamable-Horn or two-CNF class has cardinality at least the bus count. Base-class
      membership is syntactic, including formulas with empty clauses.
  - source: Proposition 6.12 (syntactic backdoors)
    lean: Controller.Boundaries.Backdoors.specification_backdoor_lower_bound
    module: Controller.Boundaries.Backdoors
    status: proved
    note: The same bus-count lower bound holds for strong or deletion backdoors of the displayed
      specification formula into the three syntactic base classes.
  - source: Proposition 6.11 (conditional structural component)
    lean: Controller.Graph.CoverCircuit.linear_width_obstruction
    module: Controller.Graph.CoverNets
    status: proved
    note: For a supplied vertex-expanding graph with degree bound D, the explicit cover layout
      satisfies the stated linear size-versus-treewidth, net-cutwidth and K-input block-width
      inequalities, with C=12000*c*(D+1). Expansion and bounded degree remain premises; no infinite
      expander construction or DNNF/OBDD lower bound is selected.
  - source: Proposition 6.2 (critical-family source recovery refinement)
    lean: Controller.Cost.CriticalSourceScan.critical_physical_recovery
    module: Controller.Cost.CriticalSourceRecovery
    status: proved
    note: One source-reading program recovers the canonical indicator and a physical detecting
      realization under the critical-family promise, with complete cold-run bounds.
  - source: Example 6.1 (cycle source recovery refinement)
    lean: Controller.Cost.CriticalSourceScan.cycle_physical_recovery
    module: Controller.Cost.CriticalSourceRecovery
    status: proved
    note: The same fixed program recovers and realizes the full simultaneous detecting set for
      the modulo-cycle source.
  - source: Proposition 6.10 (binary-expanded native primal graph)
    lean: Controller.Graph.BoundedNativeWidth.primal_treewidth_lower
    module: Controller.Graph.NativeMinor
    status: proved
    note: The primal graph is built from the complete binary-expanded native CNF; its treewidth
      is at least min(channels,buses).
  - source: Proposition 6.10 (binary-expanded native incidence graph)
    lean: Controller.Graph.BoundedNativeWidth.incidence_treewidth_lower
    module: Controller.Graph.NativeMinor
    status: proved
    note: The incidence graph is built from the same complete native clause list; its treewidth
      is at least min(channels,buses).
