version: v0.4
project:
  name: Observation projection and typed certificate pipelines
  description: Conditional observation-wrapper projection, intended-producer recovery, checked
    structured-family decoding and model lifting, and sound SAT/UNSAT verdicts. Exact SAT and
    certified-UNSAT completeness claims assume successful family acceptance, with an accepted
    refutation certificate for the latter. Acceptance with an observed root requires more source
    coordinates than native variables.
  authors:
  - Idris Ali Shaik
  license: Apache-2.0
  responsible_maintainers:
  - Idris Ali Shaik
classification:
  arxiv:
  - cs.DM
  msc2020:
  - '68Q25'
  - '68Q60'
sources:
- title: 'Polynomial Fault Detection Without Bounded Width: Exact Reachable Sets in Priority Controllers'
  authors:
  - Idris Ali Shaik
  id: doi:10.5281/zenodo.23400057
  type: preprint
  location: https://zenodo.org/records/23400057
  relationship: formalizes
  note: Version 1.0; Theorems A.1 and A.2 (observation projection and optional activities), Corollary
    A.3 (selected observations), Lemma A.4 (producer recovery), and Section 8 (certificates).
    The typed payload and pipeline statements refine the interface account; they do not formalize
    a raw-file parser, unrestricted CNF recognition or every construction-time clause of Appendix
    A.
  license: unknown
  author_endorsement: participated
related_formalizations: []
status:
  scope: Observation-wrapper projection, recovery for the intended producer family, checked structured-family
    decoding, and typed satisfiability or certified-unsatisfiability pipeline laws. The recognizer
    accepts structured typed payloads and checks their actual conditions. It is not a DIMACS or
    JSON parser or an arbitrary-CNF presentation-discovery procedure. Projection equivalences
    do not by themselves bound the time required to construct auxiliary data. Ordered clauses
    retain all literal occurrences and formula rows. The typed family pipeline is conditional
    on successful acceptance. With at least one observed root, acceptance requires strictly more
    original source coordinates than native variables; plain native coordinates alone cannot satisfy
    this interface. A nontrivial positive-output acceptance construction is not included. Projection
    theorems retain the declared wrapper grammar and its activity-polarity convention; they do
    not establish a raw-file recognizer or construction-time bound.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
