alignment:
  namespace: Controller
  statements:
  - source: Theorem A.1 (conditional observation projection)
    lean: Controller.Native.ObservationProjection.observation_projection_of_unit_conflict
    module: Controller.Native.ObservationProjection
    status: proved
    note: The exact A.1 projection follows under the displayed pure-clause implication, activity
      guards, unit-derived inactive conflict and uniform constant-extension-or-impossible-orientation
      premises. These remain hypotheses; the conclusion is the existential auxiliary projection
      at every defining signal assignment.
  - source: Theorem A.2 (projection component)
    lean: Controller.Native.ObservationProjection.optional_declared_cnf_projection
    module: Controller.Native.ObservationProjection
    status: proved
    note: For the declared-private optional-activity grammar and finite internal activity type,
      existential assignments to the declared auxiliaries exist exactly when a requirement-tree
      leaf pair is discrepant. This theorem proves projection, not the linear-time auxiliary construction
      clause of A.2.
  - source: Corollary A.3 (including the formal empty-selection case)
    lean: Controller.Native.ObservationProjection.selected_declared_cnf_projection
    module: Controller.Native.ObservationProjection
    status: proved
    note: For a selected list contained in the optional wrapper leaves, the declared selected
      formula projects exactly to a discrepancy on that list. The formal statement also handles
      an empty selected list via its unsatisfiable selected formula.
  - source: Lemma A.4 (intended-producer recovery)
    lean: Controller.Recognition.IntendedDAG.recovery_exact
    module: Controller.Recognition.ProducerCompletion
    status: proved
    note: A maximal recovery run under CandidatePromise emits only the intended nonroot producers,
      recovers every nonroot and has duplicate-free output identifiers. The intended DAG, candidate
      promise, run and absence of a ready remaining candidate are explicit premises; this is not
      arbitrary-CNF discovery or a runtime bound.
  - source: Section 8 (typed pipeline)
    lean: Controller.Recognition.GuardedFamily.decodeChecked_sound
    module: Controller.Recognition.FamilyRecord
    status: proved
    note: Given a structured CompletePayload and a returned checked record, the supplied decoder
      is guarded, the record passes its check, and source satisfiability is equivalent to physical
      bridge detectability. This is the supplied typed-family boundary, not the complete raw-file
      Algorithm 2 recognizer.
  - source: Section 8 (typed pipeline)
    lean: Controller.Recognition.GuardedFamily.decodeChecked_lifting
    module: Controller.Recognition.FamilyRecord
    status: proved
    note: After successful decodeChecked, any satisfying assignment of the specified native formula
      lifts through the returned record to a satisfying assignment of the original source. This
      is model-lifting soundness, with no separate construction-time conclusion.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_sat_iff
    module: Controller.Certificate.Pipeline
    status: proved
    note: For an accepted checked family record and the structured serialization of the source,
      runFamily returns SAT exactly when the source is satisfiable, for any optional refutation
      argument. Acceptance of the supplied typed representation remains a premise.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_certified_unsat
    module: Controller.Certificate.Pipeline
    status: proved
    note: For an accepted checked family record and structured source serialization, a supplied
      certificate accepted by checkTyped causes runFamily to return UNSAT. This is conditional
      certificate completeness; it does not produce a refutation autonomously.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_sat_sound
    module: Controller.Certificate.Pipeline
    status: proved
    note: Every SAT verdict on any SubmittedInput is sound for the bound source formula. CompletePayload
      is supplied structured data; parsing arbitrary byte formats is outside this statement.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_unsat_sound
    module: Controller.Certificate.Pipeline
    status: proved
    note: Every UNSAT verdict on any SubmittedInput is sound for the bound source formula. The
      checked typed certificate and input-binding branches are part of the displayed pipeline,
      without an arbitrary-CNF family-recognition claim.
  - source: Section 8 (typed-interface coordinate boundary)
    lean: Controller.Recognition.GuardedFamily.decodeChecked_requires_extra_coordinates
    module: Controller.Recognition.FamilyRecord
    status: proved
    note: If the typed decoder accepts a record with at least one observed root, the original
      source has strictly more coordinates than the native variable type. Private activities therefore
      require extra coordinates; this theorem records a necessary condition and does not construct
      an accepted record.
