version: v0.4
project:
  name: Observation projection and typed certificate pipelines
  description: Conditional observation-wrapper projection, a physical detector consequence for guarded
    optional wrappers, finite intended-producer recovery from a promised candidate list, checked structured-family
    decoding and model lifting, and sound SAT/UNSAT verdicts. Exact SAT and certified-UNSAT completeness
    assume successful family acceptance, with an accepted refutation certificate for the latter. Positive-output
    acceptance requires extra source coordinates; a fully accepted satisfiable two-channel, one-bus packet
    with one observed output realizes this interface.
  authors:
  - Idris Ali Shaik
  license: Apache-2.0
  responsible_maintainers:
  - Idris Ali Shaik
classification:
  arxiv:
  - cs.DM
  msc2020:
  - '68Q25'
  - '68Q60'
sources:
- title: 'Polynomial Fault Detection Without Bounded Width: Exact Reachable Sets in Priority Controllers'
  authors:
  - Idris Ali Shaik
  id: doi:10.5281/zenodo.23400057
  type: preprint
  location: https://zenodo.org/records/23400057
  relationship: formalizes
  note: Version 1.0; Theorems A.1 and A.2 (observation projection and optional activities), Corollary
    A.3 (selected observations), Lemma A.4 (producer recovery), and Section 8 (certificates). The typed
    payload and pipeline statements refine the interface account; they do not formalize a raw-file parser,
    unrestricted CNF recognition or every construction-time clause of Appendix A. The finite scanning
    driver, physical-detector corollary and concrete positive-output accepted packet are refinements stated
    and proved in this formalization.
  license: unknown
  author_endorsement: participated
related_formalizations: []
status:
  scope: Observation-wrapper projection, a guarded physical detector equivalence for declared optional
    wrappers, exact finite scanning recovery under CandidatePromise, checked structured-family decoding
    and model lifting, and typed SAT or certified-UNSAT pipeline laws. A complete serialized positive-output
    packet with 36 coordinates and 91 rows is accepted, has a physical detecting input and a satisfying
    source assignment, and receives a SAT verdict. Candidate discovery, arbitrary-CNF recognition, raw-file
    parsing, a general accepted-family constructor and machine-level construction-time bounds are outside
    these statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
automation:
  methods:
  - method: agent
    models:
    - GPT-6
    - Claude Opus 5.5
    framework: OpenAI Codex and Claude Code
    tool_setup: AI-assisted Lean proof development, source inspection, command-line builds and axiom audits.
      Recorded model identities are not a complete historical usage log.
    cost:
      wall_time: not tracked
      spend_usd: not tracked
      hardware: Local Apple Silicon computer
    prompting_notes: Prove observation projection and typed certificate soundness, construct the finite
      recovery driver and a complete positive-output serialized witness, and relate declared optional
      wrappers to physical detection. Check literal hypotheses and permitted axioms.
  spend_usd: not tracked
  notes: The author directed the formalization. AI agents assisted with proof construction and packaging.
fidelity:
  divergences: The projection and physical-detector equivalences retain declared private support, observed-pair
    matching and observed-root coverage; the detector corollary also requires a guarded decoder. Finite
    scanning retains the exact CandidatePromise but requires no supplied execution or maximality witness.
    General typed pipeline completeness retains successful acceptance, while the concrete positive-output
    packet supplies a full accepted example. No arbitrary-CNF discovery procedure or machine-level construction-time
    theorem is asserted.
review:
  status: self-assessed
  reviewers: []
  notes: Implementer audit of the selected declaration types, concrete certificate checks and proof-model
    boundaries. No independent human or Palomar editorial approval is claimed.
alignment:
  namespace: Controller
  statements:
  - source: Theorem A.1 (conditional observation projection)
    lean: Controller.Native.ObservationProjection.observation_projection_of_unit_conflict
    module: Controller.Native.ObservationProjection
    status: proved
    note: The exact A.1 projection follows under the displayed pure-clause implication, activity guards,
      unit-derived inactive conflict and uniform constant-extension-or-impossible-orientation premises.
      These remain hypotheses; the conclusion is the existential auxiliary projection at every defining
      signal assignment.
  - source: Theorem A.2 (projection component)
    lean: Controller.Native.ObservationProjection.optional_declared_cnf_projection
    module: Controller.Native.ObservationProjection
    status: proved
    note: For the declared-private optional-activity grammar and finite internal activity type, existential
      assignments to the declared auxiliaries exist exactly when a requirement-tree leaf pair is discrepant.
      This theorem proves projection, not the linear-time auxiliary construction clause of A.2.
  - source: Corollary A.3 (including the formal empty-selection case)
    lean: Controller.Native.ObservationProjection.selected_declared_cnf_projection
    module: Controller.Native.ObservationProjection
    status: proved
    note: For a selected list contained in the optional wrapper leaves, the declared selected formula
      projects exactly to a discrepancy on that list. The formal statement also handles an empty selected
      list via its unsatisfiable selected formula.
  - source: Lemma A.4 (intended-producer recovery)
    lean: Controller.Recognition.IntendedDAG.recovery_exact
    module: Controller.Recognition.ProducerCompletion
    status: proved
    note: A maximal recovery run under CandidatePromise emits only the intended nonroot producers, recovers
      every nonroot and has duplicate-free output identifiers. The intended DAG, candidate promise, run
      and absence of a ready remaining candidate are explicit premises; this is not arbitrary-CNF discovery
      or a runtime bound.
  - source: Section 8 (typed pipeline)
    lean: Controller.Recognition.GuardedFamily.decodeChecked_sound
    module: Controller.Recognition.FamilyRecord
    status: proved
    note: Given a structured CompletePayload and a returned checked record, the supplied decoder is guarded,
      the record passes its check, and source satisfiability is equivalent to physical bridge detectability.
      This is the supplied typed-family boundary, not the complete raw-file Algorithm 2 recognizer.
  - source: Section 8 (typed pipeline)
    lean: Controller.Recognition.GuardedFamily.decodeChecked_lifting
    module: Controller.Recognition.FamilyRecord
    status: proved
    note: After successful decodeChecked, any satisfying assignment of the specified native formula lifts
      through the returned record to a satisfying assignment of the original source. This is model-lifting
      soundness, with no separate construction-time conclusion.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_sat_iff
    module: Controller.Certificate.Pipeline
    status: proved
    note: For an accepted checked family record and the structured serialization of the source, runFamily
      returns SAT exactly when the source is satisfiable, for any optional refutation argument. Acceptance
      of the supplied typed representation remains a premise.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_certified_unsat
    module: Controller.Certificate.Pipeline
    status: proved
    note: For an accepted checked family record and structured source serialization, a supplied certificate
      accepted by checkTyped causes runFamily to return UNSAT. This is conditional certificate completeness;
      it does not produce a refutation autonomously.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_sat_sound
    module: Controller.Certificate.Pipeline
    status: proved
    note: Every SAT verdict on any SubmittedInput is sound for the bound source formula. CompletePayload
      is supplied structured data; parsing arbitrary byte formats is outside this statement.
  - source: Section 8 (typed pipeline)
    lean: Controller.Certificate.Pipeline.runFamily_unsat_sound
    module: Controller.Certificate.Pipeline
    status: proved
    note: Every UNSAT verdict on any SubmittedInput is sound for the bound source formula. The checked
      typed certificate and input-binding branches are part of the displayed pipeline, without an arbitrary-CNF
      family-recognition claim.
  - source: Section 8 (typed-interface coordinate boundary)
    lean: Controller.Recognition.GuardedFamily.decodeChecked_requires_extra_coordinates
    module: Controller.Recognition.FamilyRecord
    status: proved
    note: If the typed decoder accepts a record with at least one observed root, the original source has
      strictly more coordinates than the native variable type. Private activities therefore require extra
      coordinates; this theorem records a necessary condition and does not construct an accepted record.
  - source: Guarded optional-wrapper physical detector consequence
    lean: Controller.Recognition.ObservationDetection.optional_native_decision
    module: Controller.Recognition.ObservationDetection
    status: proved
    note: For a guarded native controller, declared-private optional wrapper, exact observed pairs and
      coverage of every observed root, satisfiability over native signals and finite declared auxiliaries
      is equivalent to the physical detector returning an input. Successful typed recognition is not a
      premise; construction and discovery costs are not concluded.
  - source: Finite driver strengthening of Lemma A.4
    lean: Controller.Recognition.RecoveryDriver.recover_exact
    module: Controller.Recognition.RecoveryDriver
    status: proved
    note: The actual finite scan receives roots and candidates, retains CandidatePromise, and returns
      the full signal set and exactly the intended nonroot producers without duplicate output IDs. Its
      trace length is the signal count minus the root count. No run or saturation witness is supplied,
      and candidate discovery is not proved.
  - source: Positive-output typed acceptance witness
    lean: Controller.Recognition.exists_accepted_positive_output
    module: Controller.Recognition.AcceptanceInhabited
    status: proved
    note: A two-channel, one-bus, drive-enabled instance with one observed output, 36 source coordinates
      and 91 rows has a complete serialized payload accepted by decodeChecked, a physical detecting input,
      a SAT pipeline verdict and a satisfying assignment of the original source. This is a concrete existence
      theorem, not a constructor for every represented family.
