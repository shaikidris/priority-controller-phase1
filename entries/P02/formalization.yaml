status:
  scope: Correctness and completeness of fault detection and extension over a supplied guarded
    decoder DAG, together with an executed native cold-detector bound. The decoder is supplied
    as structured finite data. Fixed signs constrain eligibility coordinates. The cold-detector
    resource theorem uses its displayed native instruction model and encoded input layout; it
    is not a conventional encoded-language membership theorem and does not discover a guarded
    presentation of arbitrary CNF. The resource theorem measures execution of a Solution-supplied
    instance-dependent program. Comparator does not fix the body of this definition hole. A uniform
    charged constructor for this program family is not selected. The checked emitted model is
    not linked by this theorem to the fixed eligibility sets T/F, and its live-word bound includes
    the native-size term on rejection as well as acceptance.
