alignment:
  namespace: Controller
  statements:
  - source: Theorem 5.1 (semantic correctness and completeness)
    lean: Controller.Public.guarded_bridge_detector_correct
    module: Controller.Public.Detection
    status: proved
    note: For a supplied guarded DAG, detectInput returns none exactly when no physical bridge-interface
      input and wire value distinguish an observed root. Every returned input satisfies the drive
      interface with wire true and distinguishes a root. This is the semantic correctness component
      of 5.1.
  - source: Theorem 5.1 (semantic correctness and completeness)
    lean: Controller.Public.guarded_bridge_detector_complete
    module: Controller.Public.Detection
    status: proved
    note: For a supplied guarded DAG, existence of a returned input is equivalent to physical
      bridge detectability. The theorem covers the drive parameter explicitly; the separate execution
      theorem has its own layout, program-family and storage premises.
  - source: Theorems 5.1 and 5.4 (mechanized implementation refinement)
    lean: Controller.Cost.SharedDetectorCold.execution
    module: Controller.Cost.SharedDetectorCold
    status: proved
    note: The program and its exact numerical bounds refine the manuscript algorithms; they are
      not separately numbered source claims. The charged cold native program requires raw layout,
      drive one, consistent fixed sets, matching rows/heads/roots and the displayed observation
      correspondence and initial packet. It halts with the exact constrained detection answer,
      at most 5100*(n+q+1)*(G+1) ticks plus 55 times the displayed selected native size on acceptance,
      bounded live words and a checked native model when it accepts. These representation and
      native instruction premises remain explicit.
  - source: Theorem 5.4 (eligibility extension)
    lean: Controller.Decoder.DAG.extendSet_some
    module: Controller.Decoder.Extend
    status: proved
    note: Every returned extension has drive one, is admissible, extends the fixed true/false
      eligibility sets and changes a supplied root from its target-singleton value. Fixed sets
      constrain eligibility coordinates.
  - source: Theorem 5.4 (eligibility extension)
    lean: Controller.Decoder.DAG.extendSet_none_iff
    module: Controller.Decoder.Extend
    status: proved
    note: The extension routine returns none exactly when there is no admissible detecting extension
      satisfying the fixed eligibility sets and drive-one condition. This is an exact semantic
      failure criterion, including inconsistent constraints.
  - source: Theorem 5.4 (eligibility extension)
    lean: Controller.Decoder.DAG.extendSet_exists_iff
    module: Controller.Decoder.Extend
    status: proved
    note: Existence of a returned extension is equivalent to existence of an admissible root-changing
      extension of the fixed eligibility sets, together with drive one. It does not constrain
      arbitrary enable/request bits.
