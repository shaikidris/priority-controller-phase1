status:
  scope: Checked ordinary-resolution construction for the native controller encoding and supported
    observation wrappers, with cubic inference bounds and the displayed derived-literal storage
    bound. The resolution checker and clause semantics are explicit. Bounds count the displayed
    inference or literal-storage measures and use the formal native or wrapper size parameters.
    These are ordinary resolution results, with no extension rule or generic claim for arbitrary
    CNF. The selected joint resource theorem bounds inference count and derived-literal storage
    for the same compactRefute object. Compiler existence and checked-trace results do not assert
    a polynomial-time executable compiler or charge code generation. Native and wrapper size parameters
    and their representation premises remain explicit.
