status:
  scope: Physical detection execution for supplied formula forests and bounds of admissible true-set
    weights by a returned candidate score, with linear operation counts. The selected score theorem
    is an upper-bound component of Corollary 6.7; attainment, candidate existence and maximum-weight
    optimality of the emitted physical test are not conclusions of the selected surface. The fetched-execution
    bound starts after instance-dependent code construction. The reference factory evaluates runAll
    and embeds the selected result while constructing the code; that computation is not charged
    by the fetched tick bound. This does not establish the paper's uniform linear-time algorithm.
    Acceptance emits an eligible-set indicator defining a canonical physical input, rather than
    all primary-input coordinates. The weighted result is a conditional score upper bound, without
    candidate existence or attainment.
