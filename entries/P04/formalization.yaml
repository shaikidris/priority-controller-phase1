alignment:
  namespace: Controller
  statements:
  - source: Theorem 5.6 (native forest execution refinement)
    lean: Controller.Cost.ForestOriginalSemantics.original_physical_execution
    module: Controller.Cost.ForestOriginalSemantics
    status: proved
    note: For matching forest representations, the selected instance-dependent program halts with
      the exact physical-detection answer. Acceptance supplies an admissible detecting K and emits
      its indicator as a descriptor of the canonical physical input. Fetched ticks and storage
      are bounded after code construction. The reference constructor precomputes the selection;
      the tick bound does not include that computation.
  - source: Corollary 6.7 (conditional score upper-bound component)
    lean: Controller.Optimization.Weights.forest_maximum_weight
    module: Controller.Optimization.Weights
    status: proved
    note: The original conditional upper-bound component is preserved. The separately selected
      physical-maximum theorem supplies candidate existence, attainment and physical optimality
      under healthy-zero observations.
  - source: Corollary 6.7 (healthy-zero maximum weight)
    lean: Controller.Optimization.Weights.forest_physical_maximum
    module: Controller.Optimization.Weights
    status: proved
    note: Detectability supplies an attained maximum among admissible detecting sets; nonnegative
      weights and healthy-zero observations are explicit.
