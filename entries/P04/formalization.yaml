status:
  scope: The selected surface preserves the original physical execution and conditional score
    bound and adds candidate existence, attainment and optimality of a physically detecting eligible
    set under healthy-zero observations, nonnegative weights, positive bus count and detectability.
    The complete source-driven forest constructor has separately checked linear construction work
    and temporary word-storage bounds in the companion proof package. Construction is measured
    in source word/list operations; generic weight arithmetic, bit encoding and full primary-input
    serialization retain separate contracts.
