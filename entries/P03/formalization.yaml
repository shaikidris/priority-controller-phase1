status:
  scope: Canonical eligible-set enumeration with actual prefix traversal, exact returned sets,
    detecting emitted witnesses, iterator delay and native program resource bounds. The selected
    bounds concern the displayed native program and its declared word width and storage measures.
    Canonical results are eligible qualifier sets and their formal realizations. The entry does
    not count all primary-input assignments or assert an unproved encoded image constructor. One
    program serves all prefixes of a supplied instance. The selected search-and-emission theorem
    restores the runtime invariant, and the complete stream has an output-sensitive bound. The
    program and emitter remain Solution-supplied definition holes; a uniform charged constructor
    for the instance-dependent code is not selected.
