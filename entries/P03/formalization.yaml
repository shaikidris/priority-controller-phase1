alignment:
  namespace: Controller
  statements:
  - source: Corollary 5.5 (native enumeration refinement)
    lean: Controller.Cost.Enumeration.execution
    module: Controller.Cost.Enumeration
    status: proved
    note: The supplied program halts and emits the complete canonical result stream. This legacy
      complete-run bound uses ghost fuel 2^n+1, which counts iterator calls; use execution_output_sensitive
      for the sharper output-sensitive total. Working peak excludes the external output stream.
  - source: Corollary 5.5 (native enumeration refinement)
    lean: Controller.Cost.Enumeration.results_exact
    module: Controller.Cost.Enumeration
    status: proved
    note: The result sequence is duplicate-free and ordered by the explicit Before relation. Membership
      is exactly the Detecting predicate for the supplied guarded DAG, bus count, target and drive.
      Objects enumerated are eligible channel sets.
  - source: Corollary 5.5 (native enumeration refinement)
    lean: Controller.Cost.Enumeration.canonical_result_detects
    module: Controller.Cost.Enumeration
    status: proved
    note: Each enumerated eligible set gives a detecting drive-one canonical primary input under
      realizeBridge. This is a witness-correctness theorem and does not count every primary assignment
      or native-CNF model.
  - source: Corollary 5.5 (native enumeration refinement)
    lean: Controller.Cost.Enumeration.iterator_delay
    module: Controller.Cost.Enumeration
    status: proved
    note: From any state satisfying the runtime invariant, the supplied program finds the next
      result or exhaustion within 100000*n*(n+q)*G ticks. Output is unchanged during search. The
      selected stream_step theorem also charges emission and restores the invariant.
  - source: Corollary 5.5 (native enumeration refinement) (supporting bound)
    lean: Controller.Cost.Enumeration.delay_bound
    module: Controller.Cost.Enumeration
    status: proved
    note: The symbolic iterator delay function is bounded by 100000*n*(n+q)*countedSize. This
      arithmetic bound accompanies the separate actual iterator execution theorem.
  - source: Corollary 5.5 (native enumeration refinement) (supporting bound)
    lean: Controller.Cost.Enumeration.program_words_bound
    module: Controller.Cost.Enumeration
    status: proved
    note: The immutable native program has the explicit linear word bound in channel count, coordinate
      count and countedSize, assuming RootsMatch. This bounds code words separately from mutable
      working storage and streamed output.
  - source: Corollary 5.5 (output-sensitive native stream component)
    lean: Controller.Cost.Enumeration.execution_output_sensitive
    module: Controller.Cost.Enumeration
    status: proved
    note: The complete run halts with exactly the canonical result stream in at most (r+1)*delay+r*emitBudget
      ticks, where r is the number of results. Working peak is at most 258*(G+1); results are
      a ghost specification, with external output accounted separately. The instance-dependent
      code-construction boundary remains explicit.
  - source: Corollary 5.5 (search, emission and continuation)
    lean: Controller.Cost.Enumeration.stream_step
    module: Controller.Cost.Enumeration
    status: proved
    note: Starting from the iterator invariant, one run either halts on exhaustion or emits the
      next canonical model and restores the invariant for the following call. Search plus emission
      takes at most 100000*n*(n+q)*G+emitBudget ticks with working peak at most 258*(G+1).
